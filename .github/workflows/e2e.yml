name: Frontend E2E

# Playwright-Flows aus frontend/e2e/*.spec.ts (#4436) gegen einen frisch
# geseedeten Stack: Postgres und Mailpit als Services, Backend-Binary,
# migrate, seed (alle Profile, Standardprofil `vollbetrieb`) und ein
# Production-Build des Frontends, den der webServer-Block von
# frontend/playwright.config.ts mit `next start` bedient
# (E2E_FRONTEND_SERVER=start; lokal bleibt es `next dev`). Die serverlosen
# Layouttests unter frontend/e2e/layout/ laufen weiter in test.yml.
#
# Jede Suite läuft mit einem Worker. Darum laufen die Suites parallel in
# eigenen Jobs: die Flows in drei Shards, die Seed und Build einmal von den
# Jobs `seed` und `build` übernehmen, die Netzwerksuiten ohne Datenbank gegen ihr
# synthetisches Backend mit `next dev` (e2e/network/server.mjs). Das
# Repository ist öffentlich, die GitHub-Runner kosten nichts; jeder Job
# kostet seinen Aufbau an Zeit.
#
# Kein Required Check und kein PR-Lauf: die Flows hängen am echten Heute und
# an den Seed-Daten. Auf PRs dauerten sie 9-11 min und fanden in einer Woche
# (7.-14.11.2026, 27 rote von 178 Läufen) nur Testdrift und Flakes, keinen
# Produktfehler. Nachts prüft der Lauf den development-Stand; ein roter
# Nachtlauf öffnet ein Issue oder kommentiert das offene (Job `report`).
# Vor einem Merge, der Specs oder Touren ändert: workflow_dispatch auf dem
# Branch oder lokal (docs/agents/operations.md).
#
# Alle Werte unten sind Wegwerfwerte für den CI-Stack, keine Secrets.

on:
  schedule:
    # 05:00 UTC Montag bis Freitag, nach perf-nightly. Die Flows brauchen einen
    # Berliner Werktag (Wochenraster Mo-Fr).
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local

jobs:
  # Synthetic localhost backend, no database or seed (e2e/network/server.mjs).
  network:
    name: Playwright ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [network evidence, tenant switch]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Systemweites Google Chrome statt des gebündelten Chromium (#5612):
      # --force aktualisiert das veraltete Chrome des Runner-Images;
      # frontend/scripts/secure-chrome.setup.ts lehnt ungepatchte Versionen ab.
      - name: Install Google Chrome
        working-directory: frontend
        run: pnpm exec playwright install --with-deps --force chrome

      # Separate frontend + localhost-only synthetic API; never calls vendors.
      - name: Run portal network evidence
        if: matrix.suite == 'network evidence'
        working-directory: frontend
        env:
          # Readiness must work even when Node cannot resolve portal hosts.
          NODE_OPTIONS: "--require ./e2e/network/no-subdomain-dns.cjs"
        run: pnpm run test:network

      - name: Upload sanitized network evidence
        if: always() && matrix.suite == 'network evidence'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-network-evidence-${{ github.run_id }}
          path: frontend/test-results/network/*/network*.json
          retention-days: 7
          if-no-files-found: error

      # Shared-cookie fixture domains and keys; its own job starts with a fresh
      # Turbopack dev cache (a stale one caused an HMR reload loop).
      - name: Run shared-cookie tenant-switch regression
        if: matrix.suite == 'tenant switch'
        working-directory: frontend
        env:
          NODE_OPTIONS: "--require ./e2e/network/no-subdomain-dns.cjs"
        run: pnpm run test:tenant-switch

  # Seed und Frontend-Build einmal pro Lauf statt in jedem Shard, in zwei
  # Jobs nebeneinander: in einem Job bremsten sich Next-Build, Go-Build und
  # Seed auf vier Kernen gegenseitig aus. `seed` seedet wie bisher gegen den
  # frisch migrierten Stack und sichert die Datenbank samt Rollen, das
  # Backend-Binary, backend/.seed-state.json und die Uploads; die Shards
  # stellen sie wieder her. Ein Cache über Läufe hinweg trüge nicht: der Seed
  # schreibt relativ zum echten Heute (Anwesenheiten, Schichten, Fristen), ein
  # Stand von gestern gäbe den Flows falsche Tage.
  seed:
    name: Seed the E2E flow database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-name: e2e-seed-${{ github.run_id }}-${{ github.run_attempt }}

    services:
      postgres:
        image: postgres:17.12-alpine3.24@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
        env:
          POSTGRES_DB: phoenix_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Europe/Berlin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        # Operator login enrolls MFA and reads the code back out of mailpit's
        # REST API, so the seeder cannot authenticate without a mail sink.
        image: axllent/mailpit:v1.30
        ports:
          - 1025:1025
          - 8025:8025


    env: &stack-env
      # --- Backend (validateServeConfig() requires every one of these) ---
      DB_DSN: postgres://postgres:postgres@localhost:5432/phoenix_e2e?sslmode=disable
      DB_MAX_OPEN_CONNS: "40"
      DB_MAX_IDLE_CONNS: "40"
      DB_CONN_MAX_LIFETIME: 30m
      DB_CONN_MAX_IDLE_TIME: 10m
      PHOENIX_AUTH_PASSWORD: phoenix_auth_test
      PHOENIX_DEMO_PASSWORD: phoenix_demo_test
      APP_ENV: development
      LOG_LEVEL: info
      LOG_TEXTLOGGING: "true"
      AUTH_JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
      AUTH_JWT_EXPIRY: 15m
      AUTH_JWT_REFRESH_EXPIRY: 168h
      OPERATOR_EMAIL: operator@example.com
      OPERATOR_PASSWORD: E2eFlows1234%
      OPERATOR_DISPLAY_NAME: CI Operator
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: E2eFlows1234%
      FRONTEND_URL: http://localhost:3000
      PARENTS_URL: http://eltern.localhost:3000
      # Cloudflare's documented always-passing Turnstile test keys.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      # The development key ring of .env.example for the holiday health data (#4722).
      HEALTH_DATA_KEYS: dev:bW90by1kZXYtb25seS1oZWFsdGgta2V5LTMyYnl0ZXM=
      BANK_DATA_KEYS: devbank:bW90by1kZXYtb25seS1iYW5rLWtleSEhISEhISEhISE=
      BANK_DATA_LEGACY_KEYS: ""
      SCHOOL_URL: http://schule.localhost:3000
      CATERER_URL: http://caterer.localhost:3000
      TRAEGER_URL: http://traeger.localhost:3000
      TENANT_DOMAIN: localhost
      METRICS_BEARER_TOKEN: ci-metrics-token
      # Seeder input for security.ogs_device_pin only; no runtime fallback.
      OGS_DEVICE_PIN: "1234"
      EMAIL_SMTP_HOST: localhost
      EMAIL_SMTP_PORT: 1025
      EMAIL_FROM_ADDRESS: noreply@localhost
      EMAIL_FROM_NAME: moto CI
      MAILPIT_URL: http://localhost:8025
      # The schedulers would mutate seeded rows during the run.
      CLEANUP_SCHEDULER_ENABLED: "false"
      SESSION_END_SCHEDULER_ENABLED: "false"
      # --- Frontend: `next build` inlines the NEXT_PUBLIC_* values; the build
      # and playwright.config.ts (`next start`) read the same ones. ---
      API_URL: http://localhost:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_TENANT_DOMAIN: localhost
      NEXT_PUBLIC_OPERATOR_HOSTNAME: operator.localhost:3000
      NEXT_PUBLIC_PARENTS_HOSTNAME: eltern.localhost:3000
      NEXT_PUBLIC_SCHOOL_HOSTNAME: schule.localhost:3000
      NEXT_PUBLIC_CATERER_HOSTNAME: caterer.localhost:3000
      NEXT_PUBLIC_TRAEGER_HOSTNAME: traeger.localhost:3000
      NEXT_PUBLIC_APP_ENV: development
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-e2e-throwaway-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build backend and dev tools binaries
        working-directory: backend
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/e2e-stack"
          go build -o "${GITHUB_WORKSPACE}/e2e-stack/phoenix" .
          go build -o "${RUNNER_TEMP}/devtools" ./cmd/devtools

      - name: Run migrations
        working-directory: backend
        run: |
          "${GITHUB_WORKSPACE}/e2e-stack/phoenix" migrate

      - name: Start backend
        working-directory: backend
        env:
          PORT: "8080"
        run: |
          "${GITHUB_WORKSPACE}/e2e-stack/phoenix" serve > "${RUNNER_TEMP}/server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/server.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 60s"
          exit 1

      # Writes backend/.seed-state.json; e2e/tenant-session.ts reads the
      # tenant slug and the school-admin login of the default profile from it.
      - name: Seed demo data
        working-directory: backend
        run: |
          "${RUNNER_TEMP}/devtools" seed \
            --email "${OPERATOR_EMAIL}" \
            --password "${OPERATOR_PASSWORD}" \
            --pin "${OGS_DEVICE_PIN}" \
            --url http://localhost:8080

      # The server stops before the dump, so no outbox or session write lands
      # after it. Roles are cluster objects that pg_dump leaves out; the
      # migrations created them with their passwords.
      - name: Dump the seeded database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          pid=$(cat "${RUNNER_TEMP}/server.pid")
          kill "${pid}"
          for _ in $(seq 1 30); do
            kill -0 "${pid}" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "${pid}" 2>/dev/null; then
            echo "server did not stop in 30s"
            exit 1
          fi
          docker exec "${PG_CONTAINER}" pg_dumpall -U postgres --roles-only \
            > e2e-stack/roles.sql
          docker exec "${PG_CONTAINER}" pg_dump -U postgres --format=custom \
            phoenix_e2e > e2e-stack/phoenix_e2e.dump
          ls -l e2e-stack

      - name: Pack the seeded stack
        run: |
          tar --zstd -cf "${RUNNER_TEMP}/e2e-seed.tar.zst" \
            e2e-stack backend/.seed-state.json backend/public/uploads
          ls -l "${RUNNER_TEMP}/e2e-seed.tar.zst"

      - name: Upload the seeded stack
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-seed.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Backend log
        if: always()
        run: tail -n 200 "${RUNNER_TEMP}/server.log" || true

      - name: Stop backend
        if: always()
        run: kill "$(cat "${RUNNER_TEMP}/server.pid")" 2>/dev/null || true

  # Production-Build für `next start` in den Shards, mit denselben
  # NEXT_PUBLIC_*-Werten, die sie zur Laufzeit lesen.
  build:
    name: Build the frontend for the E2E flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-name: e2e-frontend-${{ github.run_id }}-${{ github.run_attempt }}
    env: *stack-env
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the frontend
        working-directory: frontend
        run: pnpm run build

      # `next start` needs .next without the build cache and the standalone copy.
      - name: Pack the frontend build
        run: |
          tar --zstd -cf "${RUNNER_TEMP}/e2e-frontend.tar.zst" \
            --exclude=frontend/.next/cache --exclude=frontend/.next/standalone \
            frontend/.next
          ls -l "${RUNNER_TEMP}/e2e-frontend.tar.zst"

      - name: Upload the frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-frontend.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  flows:
    name: Playwright E2E flows (${{ matrix.part }})
    needs: [seed, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The tour spec runs in order (mode "default") and is one indivisible
      # block of about five minutes; Playwright's --shard would put it and
      # half of the rest into one shard. A misspelled list fails safe:
      # --test-list then finds no test (rejected below), the invert runs all.
      matrix:
        include:
          - part: Touren
            tests: --test-list "${RUNNER_TEMP}/tours.list"
          - part: Rest 1/2
            tests: --test-list-invert "${RUNNER_TEMP}/tours.list" --shard=1/2
          - part: Rest 2/2
            tests: --test-list-invert "${RUNNER_TEMP}/tours.list" --shard=2/2

    services:
      postgres:
        image: postgres:17.12-alpine3.24@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
        env:
          POSTGRES_DB: phoenix_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Europe/Berlin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        # Operator login enrolls MFA and reads the code back out of mailpit's
        # REST API, so the seeder cannot authenticate without a mail sink.
        image: axllent/mailpit:v1.30
        ports:
          - 1025:1025
          - 8025:8025


    env: *stack-env

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Systemweites Google Chrome statt des gebündelten Chromium (#5612):
      # --force aktualisiert das veraltete Chrome des Runner-Images;
      # frontend/scripts/secure-chrome.setup.ts lehnt ungepatchte Versionen ab.
      # Läuft im Hintergrund, während der Stack wiederhergestellt wird. Der
      # Download dauert unter einer Sekunde, die Zeit kosten apt und dpkg: ein
      # Cache des Pakets spart nichts.
      - name: Start Google Chrome install
        working-directory: frontend
        run: |
          (
            pnpm exec playwright install --with-deps --force chrome
            echo $? > "${RUNNER_TEMP}/chrome-install.rc"
          ) > "${RUNNER_TEMP}/chrome-install.log" 2>&1 &

      # Successful producers keep their outputs on partial reruns, even when
      # only the other producer ran again with a newer run_attempt.
      - name: Download the seeded stack
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.seed.outputs.artifact-name }}
          path: ${{ runner.temp }}

      - name: Download the frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}

      # The service database is replaced by the seeded one (--clean --create
      # also restores its database-level settings and grants). The dump of the
      # roles carries the superuser the service already has; that role stays.
      # pg_restore keeps no planner statistics, so ANALYZE follows.
      - name: Restore the seeded database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          tar --zstd -xf "${RUNNER_TEMP}/e2e-seed.tar.zst"
          tar --zstd -xf "${RUNNER_TEMP}/e2e-frontend.tar.zst"
          grep -Ev '^(CREATE|ALTER) ROLE postgres[ ;]' e2e-stack/roles.sql \
            | docker exec -i "${PG_CONTAINER}" psql -q -v ON_ERROR_STOP=1 -U postgres -d postgres
          docker exec -i "${PG_CONTAINER}" pg_restore -U postgres --exit-on-error \
            --clean --if-exists --create -d postgres < e2e-stack/phoenix_e2e.dump
          docker exec "${PG_CONTAINER}" psql -q -v ON_ERROR_STOP=1 -U postgres -d phoenix_e2e -c ANALYZE

      # PORT only here: `next start`, started by playwright.config.ts, reads
      # PORT too and must stay on 3000.
      - name: Start backend
        working-directory: backend
        env:
          PORT: "8080"
        run: |
          "${GITHUB_WORKSPACE}/e2e-stack/phoenix" serve > "${RUNNER_TEMP}/server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/server.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 60s"
          exit 1

      - name: Wait for Google Chrome install
        timeout-minutes: 5
        run: |
          while [ ! -f "${RUNNER_TEMP}/chrome-install.rc" ]; do sleep 1; done
          cat "${RUNNER_TEMP}/chrome-install.log"
          exit "$(cat "${RUNNER_TEMP}/chrome-install.rc")"

      # playwright.config.ts starts `next start` on port 3000 itself (CI=true
      # disables reuseExistingServer) and runs one worker. Each part has its
      # own copy of the seeded database.
      - name: Run E2E flows
        working-directory: frontend
        env:
          E2E_FRONTEND_SERVER: start
        run: |
          echo onboarding-tours.spec.ts > "${RUNNER_TEMP}/tours.list"
          pnpm run test:e2e ${{ matrix.tests }}

      # Reject empty runs and skips: the Krank-Flow moves the browser clock
      # to Monday on weekends instead of skipping (#4027).
      - name: Reject skipped or missing tests
        working-directory: frontend
        run: |
          report=test-results/e2e-results.json
          jq '.stats' "$report"
          if ! jq -e '.stats.expected > 0 and .stats.skipped == 0' "$report" > /dev/null; then
            echo "::error::E2E run executed no test or skipped tests."
            exit 1
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Backend log
        if: always()
        run: tail -n 200 "${RUNNER_TEMP}/server.log" || true

      - name: Stop backend
        if: always()
        run: kill "$(cat "${RUNNER_TEMP}/server.pid")" 2>/dev/null || true

  # Ein roter Nachtlauf soll auffallen, ohne PRs zu blockieren: ein offenes
  # Issue sammelt die roten Läufe als Kommentare, bis jemand es schließt.
  report:
    name: Report red nightly run
    needs: [network, flows]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the E2E issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Nächtliche E2E-Flows rot"
        run: |
          body="Roter Nachtlauf auf development (${GITHUB_SHA::10}): ${RUN_URL}"
          number=$(gh issue list --state open --label dev-ops --search "in:title \"${TITLE}\"" \
            --json number,title --jq "map(select(.title == \"${TITLE}\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label dev-ops --label needs-triage --body "$body"
          fi
