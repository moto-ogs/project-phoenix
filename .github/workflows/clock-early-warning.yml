name: Clock early warning

# Runs the full backend suite once per coming boundary day with the Go and
# PostgreSQL clocks moved there (#4027): tomorrow 00:30, the weekend, the
# next ISO week, the next clock change and the day after it, the next new
# year, the next three NRW holidays and the day before each, and today plus
# 30, 90 and 365 days (scripts/clock-boundaries.mjs). A test that depends on
# the day fails here before the day comes. On failure it opens one issue or
# comments on the open one (scripts/clock-early-warning.mjs).
#
# The runner clock stays real: the runner talks TLS to GitHub, and a clock
# months ahead fails the certificates (the seed smoke moves it at most five
# days for that reason). Go moves through scripts/fake-clock.sh, PostgreSQL
# through a clock shim in its own container (scripts/fake-clock-postgres.sh).
# File modification times stay real.
#
# Its own workflow, not a job in nightly.yml: the nightly run starts the
# paid full suites on weekdays and must not repeat them per day. One job runs
# all times in a row: the patched package time compiles once, every further
# time only runs tests.

on:
  # TEMPORARY verification of #4027, removed before review.
  push:
    branches: [t3/issue-4027-open-items]
  schedule:
    # Sunday morning, outside the nightly (Mon-Fri 02:00) and perf runs.
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      times:
        description: 'Berlin times separated by ";" (YYYY-MM-DDTHH:MM reason); empty takes the coming boundaries'
        type: string
        default: ""
      dry-run:
        description: Print the issue text instead of opening or commenting
        type: boolean
        default: true

permissions: {}

concurrency:
  group: clock-early-warning
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOFLAGS: -tags=testhooks -trimpath

jobs:
  backend:
    name: Backend tests at moved clocks
    strategy:
      fail-fast: false
      matrix:
        include:
          - times: "2026-11-15T00:30 UTC-Tag;2026-11-21T00:30 Samstag;2026-11-22T23:30 Sonntagabend;2026-12-12T00:30 Samstag Flow E;2026-12-24T12:00 Heiligabend;2026-12-25T00:30 Feiertag;2027-01-01T00:30 Neujahr;2027-01-04T00:30 Montag nach Neujahr"
          - times: "2027-02-15T00:30 nach 14.02.;2027-03-01T00:30 Maerz;2027-03-25T12:00 vor Karfreitag;2027-03-28T00:30 Zeitumstellung Ostern;2027-03-29T00:30 Ostermontag;2027-04-20T00:30 nach 2027-04-19;2027-05-06T00:30 Himmelfahrt;2027-05-17T00:30 Pfingstmontag"
          - times: "2027-05-27T00:30 Fronleichnam;2027-06-29T00:30 Phasenende;2027-07-28T00:30 Phasenende;2027-08-01T00:30 nach 2027-07-31;2027-09-01T00:30 Rollover;2027-10-31T00:30 Zeitumstellung;2027-11-01T00:30 Allerheiligen;2027-11-13T00:30 Samstag in einem Jahr"
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # About thirteen times at 4-6 min each plus one cold compile.
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    env:
      PHX_TEST_RUN_ID: clock-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The architecture tests compare with development's history, as in
      # test.yml's "Start fetching backend comparison history".
      - name: Fetch backend comparison history
        run: git fetch --no-tags --unshallow origin "$(git rev-parse HEAD)" "+refs/heads/development:refs/remotes/origin/development"

      - name: Setup Node.js for error-code generator fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install xmllint for the XML schema tests
        run: |
          command -v xmllint >/dev/null && exit 0
          sudo apt-get install -y -qq --no-install-recommends libxml2-utils \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libxml2-utils; }

      - name: Start PostgreSQL with a movable clock
        run: |
          scripts/fake-clock-postgres.sh start phoenix-clock-test 5432 "$RUNNER_TEMP/clock-postgres"
          echo "TEST_DB_DSN=$(cat "$RUNNER_TEMP/clock-postgres/dsn")" >> "$GITHUB_ENV"
          echo "PHX_FAKE_CLOCK_POSTGRES_DIR=$RUNNER_TEMP/clock-postgres" >> "$GITHUB_ENV"

      - name: Bootstrap test database template
        working-directory: backend
        env:
          PHOENIX_AUTH_PASSWORD: phoenix_auth_test
          PHOENIX_DEMO_PASSWORD: phoenix_demo_test
        run: echo "PHX_TEST_TEMPLATE=$(go run ./internal/testdb/cmd/bootstrap)" >> "$GITHUB_ENV"

      # The environment of "Run Go tests" in test.yml.
      - name: Run Go tests at moved clocks
        working-directory: backend
        env:
          PHOENIX_AUTH_PASSWORD: phoenix_auth_test
          PHOENIX_DEMO_PASSWORD: phoenix_demo_test
          FRONTEND_URL: http://localhost:3000
          PARENTS_URL: http://parents.localhost:3000
          SCHOOL_URL: http://schule.localhost:3000
          CATERER_URL: http://caterer.localhost:3000
          TRAEGER_URL: http://traeger.localhost:3000
          NEXT_PUBLIC_OPERATOR_HOSTNAME: operator.localhost:3000
          TENANT_DOMAIN: localhost
          FAKE_CLOCK_TIMES: ${{ inputs.times || matrix.times }}
        run: |
          # Any 32+ characters: the MFA service keys trusted-device cookies with it.
          AUTH_JWT_SECRET=$(openssl rand -hex 32)
          export AUTH_JWT_SECRET
          FAKE_CLOCK_TIMES=${FAKE_CLOCK_TIMES//;/$'\n'}
          export FAKE_CLOCK_TIMES
          mapfile -t packages < <(go list ./... | FULL_SUITE=true ../scripts/backend-test-matrix.sh |
            jq -er '.include[] | select(.shard == 0) | .packages')
          # As test.yml: GOGC=400 for compiler and linker only.
          GOGC=400 ../scripts/test-backend-clocks.sh "$RUNNER_TEMP/clock-results" \
            -count=1 -vet=off -parallel 8 -p 6 -exec "env -u GOGC" "${packages[@]}"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clock-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/clock-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Report failing times
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.event_name != 'schedule' && inputs.dry-run != false }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/clock-early-warning.mjs report "$RUNNER_TEMP/clock-results" "${args[@]}"

      - name: Stop PostgreSQL
        if: ${{ always() }}
        run: docker stop phoenix-clock-test > /dev/null 2>&1 || true
