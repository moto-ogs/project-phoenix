apiVersion: 1

# Vertragsdrift in Produktion (#7809): Der Katalog-Proxy des Frontends lehnt
# jede Backend-Antwort ab, die nicht zum erzeugten Decoder passt, antwortet 502
# und schreibt eine Zeile "contract_decode_failed" mit route, write und den
# Pfaden der Abweichung (frontend/src/lib/contract/client.server.ts). Jede
# solche Zeile ist ein Fehler: Go und das Generat passen nicht zusammen. Ein
# Alarm je Route, schon ab der ersten Zeile in 5 Minuten.
# Runbook: monitoring/runbooks/contract-decode.md.
groups:
  - orgId: 1
    name: Phoenix Contract Decode
    folder: Phoenix Alerts
    interval: 1m
    rules:
      - uid: contract-decode-failed
        title: Backend answer does not match the contract
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: 'sum by (route) (count_over_time({env="prod",service="frontend"} |= "contract_decode_failed" | json msg, route | msg="contract_decode_failed" [5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: 'Der Katalog-Proxy lehnt Antworten von {{ $labels.route }} ab (502, contract_decode_failed).'
          description: Go sendet eine Antwort, die nicht zum erzeugten Decoder passt. Die Logzeile nennt die abweichenden Pfade. Runbook beachten.
          runbook_url: https://github.com/moto-ogs/project-phoenix/blob/main/monitoring/runbooks/contract-decode.md
        labels:
          env: prod
          issue: "7809"
          service: frontend
          severity: critical
        isPaused: false
