services:
  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        : "$${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}"
        escaped_token="$$(printf '%s' "$${METRICS_BEARER_TOKEN}" | sed 's/[\/&]/\\&/g')"
        sed "s/__METRICS_BEARER_TOKEN__/$${escaped_token}/g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.listen-address=0.0.0.0:9090 \
          --web.enable-lifecycle
    env_file:
      - path: .env
        required: false
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
      - production
      - staging
    logging:
      driver: journald
      options:
        tag: monitoring-prometheus

  node-exporter:
    image: prom/node-exporter:v1.10.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node-exporter/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    pid: host
    ports:
      - 127.0.0.1:9100:9100
    volumes:
      - /:/host:ro,rslave
      - ./node-exporter-textfile:/var/lib/node-exporter/textfile:ro
    logging:
      driver: journald
      options:
        tag: monitoring-node-exporter
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - 127.0.0.1:8082:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    logging:
      driver: journald
      options:
        tag: monitoring-cadvisor
    networks:
      - monitoring

  # Cluster view next to the backend pool gauges. Each DSN names the
  # dedicated postgres_exporter role (pg_monitor, no table access) with
  # sslmode=require; both keys live in /root/monitoring/.env. The per-table
  # collectors stay off: their pg_stat_user_tables query took ~400 ms every
  # scrape, nine times the database time of all application roles.
  postgres-exporter-prod:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    command:
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
    environment:
      DATA_SOURCE_NAME: ${PG_EXPORTER_PROD_DSN:?PG_EXPORTER_PROD_DSN is required}
    ports:
      - 127.0.0.1:9187:9187
    logging:
      driver: journald
      options:
        tag: monitoring-postgres-exporter-prod
    networks:
      - monitoring
      - production

  postgres-exporter-staging:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    command:
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
    environment:
      DATA_SOURCE_NAME: ${PG_EXPORTER_STAGING_DSN:?PG_EXPORTER_STAGING_DSN is required}
    ports:
      - 127.0.0.1:9188:9187
    logging:
      driver: journald
      options:
        tag: monitoring-postgres-exporter-staging
    networks:
      - monitoring
      - staging

networks:
  monitoring:
    name: phoenix-monitoring
  production:
    external: true
    name: production_production
  staging:
    external: true
    name: staging_staging

volumes:
  prometheus-data:
